name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kleva_integration_admin
          POSTGRES_PASSWORD: ci-integration-only
          POSTGRES_DB: kleva_integration_control
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U kleva_integration_admin -d kleva_integration_control"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      WHATSAPP_VERIFY_TOKEN: ci-verify-token
      META_APP_SECRET: ci-app-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint:check
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm test -- --runInBand
      - name: End-to-end tests
        run: npm run test:e2e
      - name: PostgreSQL integration tests
        env:
          KLEVA_TEST_PG_HOST: 127.0.0.1
          KLEVA_TEST_PG_PORT: 5432
          KLEVA_TEST_PG_DATABASE: kleva_integration_control
          KLEVA_TEST_PG_USER: kleva_integration_admin
          KLEVA_TEST_PG_PASSWORD: ci-integration-only
        run: npm run test:integration
