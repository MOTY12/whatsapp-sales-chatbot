name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kleva_integration_admin
          POSTGRES_PASSWORD: ci-integration-only
          POSTGRES_DB: kleva_integration_control
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U kleva_integration_admin -d kleva_integration_control"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      WHATSAPP_VERIFY_TOKEN: ci-verify-token
      META_APP_SECRET: ci-app-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/merchant-dashboard/package-lock.json
      - run: npm ci
      - name: Production dependency security audit
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        run: npm run lint:check
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm test -- --runInBand
      - name: End-to-end tests
        run: npm run test:e2e
      - name: PostgreSQL and Redis integration tests
        env:
          KLEVA_TEST_PG_HOST: 127.0.0.1
          KLEVA_TEST_PG_PORT: 5432
          KLEVA_TEST_PG_DATABASE: kleva_integration_control
          KLEVA_TEST_PG_USER: kleva_integration_admin
          KLEVA_TEST_PG_PASSWORD: ci-integration-only
          KLEVA_TEST_REDIS_URL: redis://127.0.0.1:6379
        run: npm run test:integration
      - name: Install dashboard dependencies
        run: npm ci --prefix apps/merchant-dashboard
      - name: Dashboard lint and typecheck
        run: |
          npm run dashboard:lint
          npm run dashboard:typecheck
      - name: Dashboard component tests
        run: npm run dashboard:test
      - name: Install Playwright browser
        run: npm --prefix apps/merchant-dashboard exec -- playwright install --with-deps chromium
      - name: Dashboard browser tests
        run: npm run dashboard:test:browser
      - name: Dashboard production build
        run: npm run dashboard:build
      - name: Validate Compose configuration
        env:
          PUBLIC_DOMAIN: kleva.example.com
          REDIS_PASSWORD: ci-compose-placeholder-not-a-secret
          KLEVA_RELEASE_TAG: ci
          KLEVA_API_ENV_FILE: ../.env.runtime
          KLEVA_WORKER_ENV_FILE: ../.env.runtime
        run: docker compose -f deploy/compose.yaml config --quiet
      - name: Validate Caddy configuration
        env:
          PUBLIC_DOMAIN: kleva.example.com
        run: docker run --rm -e PUBLIC_DOMAIN -v "$GITHUB_WORKSPACE/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Build backend production image
        run: docker build -f Dockerfile -t kleva/backend:ci .
      - name: Build dashboard production image
        run: docker build -f apps/merchant-dashboard/Dockerfile -t kleva/dashboard:ci apps/merchant-dashboard
